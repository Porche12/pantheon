<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Пантеон</title>
<meta name="robots" content="noindex">
<style>
  :root{--paper:#f5eee3;--ink:#26201b;--muted:#7d7268;--terra:#a9502f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;
    background:var(--paper);color:var(--ink);
    font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;font-weight:300;line-height:1.65}
  .box{max-width:520px;text-align:center}
  .arch{width:64px;height:78px;margin:0 auto 26px;border:1px solid var(--ink);
    border-radius:50% 50% 2px 2px / 44% 44% 2px 2px;display:grid;place-items:center;
    font-family:Georgia,serif;font-size:30px;padding-top:4px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 14px}
  h1 em{color:var(--terra)}
  p{color:var(--muted);margin:0 0 26px;font-size:15px}
  a.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:2px;
    background:var(--terra);color:#fdf8f1;text-decoration:none;font-size:12px;letter-spacing:.13em;
    text-transform:uppercase;font-weight:500}
  a.tel{display:block;margin-top:20px;font-family:Georgia,serif;font-size:20px;color:var(--ink);text-decoration:none}
  .hint{margin-top:14px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <div class="arch">П</div>
    <h1>Такой страницы <em>нет</em></h1>
    <p>Возможно, ссылка устарела. Всё живое искусство — на главной.</p>
    <a class="btn" href="/pantheon/">На главную →</a>
    <a class="tel" href="tel:+79216137540">+7 (921) 613-75-40</a>
    <div class="hint">Калининград, Ленинский пр-т, 151 · ежедневно до 18:00</div>
  </div>
</body>
</html>
